name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      WEB_URL:
        description: "URL pública do web app (ex.: https://xxxx.trycloudflare.com)"
        required: true
        default: "https://example.com"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      WEB_URL: ${{ inputs.WEB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install mobile deps
        working-directory: cdt-app/mobile
        run: npm i

      - name: Add Android platform
        working-directory: cdt-app/mobile
        run: npx cap add android || true

      - name: Sync Capacitor
        working-directory: cdt-app/mobile
        run: npx cap sync android

      - name: Build APK (debug)
        working-directory: cdt-app/mobile/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdt-demo-apk
          path: cdt-app/mobile/android/app/build/outputs/apk/debug/app-debug.apk